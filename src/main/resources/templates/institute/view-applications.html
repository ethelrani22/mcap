<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(~{::title}, ~{::main})}">

<head>
    <title>View Applications</title>
</head>

<body>
<main>
    <div class="container-fluid px-4 py-4">

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-mortarboard-fill me-2"></i>Programmes &amp; Seat Occupancy</h5>
            </div>

            <div class="card-body">

                <!-- Shift tabs: only rendered when the institute offers more than one shift -->
                <ul class="nav nav-tabs mb-3" id="shift-tabs" role="tablist" th:if="${shifts != null and !shifts.isEmpty()}">
                    <li class="nav-item" th:each="s, iter : ${shifts}">
                        <button class="nav-link" th:classappend="${iter.first} ? 'active'"
                                th:text="${s.displayName}" th:attr="data-shift=${s.name()}"
                                type="button"></button>
                    </li>
                </ul>

                <div id="programme-table-loading" class="text-center text-muted py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 mb-0">Loading programmes&hellip;</p>
                </div>

                <div id="programme-table-error" class="alert alert-danger d-none"></div>

                <div class="table-responsive d-none" id="programme-table-wrap">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>Programme</th>
                            <th class="text-center">Total Seats</th>
                            <th class="text-center">Seats Occupied</th>
                            <th class="text-center">Seats Remaining</th>
                            <th class="text-center">Applicants</th>
                        </tr>
                        </thead>
                        <tbody id="programme-table-body"></tbody>
                    </table>
                </div>

                <div id="programme-table-empty" class="alert alert-info d-none">
                    No programmes found for this shift.
                </div>

            </div>
        </div>
    </div>

    <script src="/js/axios.min.js"></script>
    <script th:src="@{/js/institute/view-applications.js}"></script>
</main>
</body>
</html>
